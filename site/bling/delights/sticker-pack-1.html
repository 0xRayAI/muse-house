<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ House Stickers Vol. 1 — a Bling delight</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #141210; color: #fff; font-family: -apple-system, "Segoe UI", sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 3rem 1.5rem; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); margin-bottom: .5rem; text-align: center; }
  h1 .pink { color: #e86aa0; }
  .sub { color: #d8cfc0; margin-bottom: 2.5rem; text-align: center; }
  .sub .house { color: #e86aa0; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.25rem; width: min(92vw, 640px); }
  .sticker { background: #1e1b18; border: 1px solid #33302b; border-radius: 18px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .15s; }
  .sticker:hover { transform: scale(1.06); }
  .sticker svg { width: 62%; height: 62%; }
  .cap { margin-top: .4rem; grid-column: 1 / -1; text-align: center; color: #8a8175; font-size: .85rem; }
  @keyframes pop { 0%,100% { transform: scale(1);} 50% { transform: scale(1.25);} }
  @keyframes spin { to { transform: rotate(360deg);} }
  @keyframes floaty { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-12px);} }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-10px) rotate(4deg);} }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg);} 50% { transform: rotate(8deg);} }
  @keyframes beat { 0%,100% { transform: scale(1);} 25% { transform: scale(1.3);} 40% { transform: scale(1.05);} 60% { transform: scale(1.25);} }
  .a-pop { animation: pop 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .a-spin { animation: spin 5s linear infinite; transform-origin: center; transform-box: fill-box; }
  .a-floaty { animation: floaty 2.4s ease-in-out infinite; }
  .a-bounce { animation: bounce 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .a-wiggle { animation: wiggle 1.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .a-beat { animation: beat 1.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
</style>
</head>
<body>
<h1>House Stickers <span class="pink">Vol. 1</span></h1>
<p class="sub" id="sub">Six animated stickers for your house. Tap one to make it dance.</p>
<div class="grid" id="grid">
  <div class="sticker" data-anim="a-pop" title="Sparkle burst">
    <svg viewBox="0 0 100 100"><g class="a-pop" fill="#ffd166"><path d="M50 5 L58 38 L92 38 L64 56 L73 90 L50 70 L27 90 L36 56 L8 38 L42 38 Z"/><circle cx="82" cy="78" r="7"/><circle cx="18" cy="80" r="5"/></g></svg>
  </div>
  <div class="sticker" data-anim="a-spin" title="Gem">
    <svg viewBox="0 0 100 100"><g class="a-spin"><polygon points="50,8 82,32 64,90 36,90 18,32" fill="#7bdff2" stroke="#e86aa0" stroke-width="3"/><polyline points="18,32 82,32 50,8" fill="none" stroke="#fff" stroke-width="2"/><line x1="50" y1="8" x2="50" y2="90" stroke="#fff" stroke-width="2"/></g></svg>
  </div>
  <div class="sticker" data-anim="a-floaty" title="Rocket">
    <svg viewBox="0 0 100 100"><g class="a-floaty"><ellipse cx="50" cy="42" rx="16" ry="30" fill="#b388eb"/><circle cx="50" cy="32" r="8" fill="#141210"/><circle cx="50" cy="32" r="5" fill="#7bdff2"/><polygon points="34,58 26,82 40,68" fill="#e86aa0"/><polygon points="66,58 74,82 60,68" fill="#e86aa0"/><polygon points="46,72 54,72 50,92" fill="#ffd166"/></g></svg>
  </div>
  <div class="sticker" data-anim="a-bounce" title="Crown">
    <svg viewBox="0 0 100 100"><g class="a-bounce" fill="#ffd166" stroke="#e86aa0" stroke-width="3"><polygon points="14,70 10,30 30,48 50,18 70,48 90,30 86,70"/><rect x="14" y="70" width="72" height="12" rx="4"/></g></svg>
  </div>
  <div class="sticker" data-anim="a-wiggle" title="Party">
    <svg viewBox="0 0 100 100"><g class="a-wiggle"><polygon points="30,88 55,55 70,62 45,95" fill="#e86aa0"/><rect x="58" y="18" width="26" height="20" rx="6" fill="#7bdff2" transform="rotate(24 71 28)"/><circle cx="80" cy="48" r="4" fill="#ffd166"/><circle cx="88" cy="60" r="4" fill="#b388eb"/><circle cx="72" cy="66" r="4" fill="#fff"/><circle cx="90" cy="38" r="4" fill="#e86aa0"/></g></svg>
  </div>
  <div class="sticker" data-anim="a-beat" title="Heart">
    <svg viewBox="0 0 100 100"><g class="a-beat" fill="#e86aa0"><path d="M50 84 C20 60 12 38 24 26 C34 17 46 22 50 34 C54 22 66 17 76 26 C88 38 80 60 50 84 Z"/></g></svg>
  </div>
  <p class="cap">tap any sticker to replay its animation · more volumes coming</p>
</div>
<script>
  const house = new URLSearchParams(location.search).get("house");
  if (house) document.getElementById("sub").innerHTML =
    'Six animated stickers for <span class="house"></span>. Tap one to make it dance.';
  if (house) document.querySelector(".house").textContent = house;
  document.querySelectorAll(".sticker").forEach(function (el) {
    el.addEventListener("click", function () {
      const g = el.querySelector("g"), cls = el.dataset.anim;
      g.classList.remove(cls); void g.getBoundingClientRect(); g.classList.add(cls);
    });
  });
</script>
</body>
</html>
