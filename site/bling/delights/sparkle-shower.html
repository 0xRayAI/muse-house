<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Sparkle Shower — a Bling delight</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #141210; font-family: -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; display: block; }
  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; padding: 2rem; }
  .msg h1 { color: #fff; font-size: clamp(2rem, 6vw, 4rem); text-shadow: 0 0 30px rgba(232,106,160,.8); animation: glow 2.4s ease-in-out infinite; }
  .msg p { color: #d8cfc0; margin-top: 1rem; font-size: 1.1rem; max-width: 32rem; }
  .msg .house { color: #e86aa0; font-weight: 700; }
  @keyframes glow { 0%,100% { text-shadow: 0 0 22px rgba(232,106,160,.6);} 50% { text-shadow: 0 0 44px rgba(232,106,160,1);} }
  .tap { position: fixed; bottom: 1.2rem; width: 100%; text-align: center; color: #8a8175; font-size: .85rem; pointer-events: none; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="msg">
  <h1>✨ Your house is sparkling ✨</h1>
  <p id="sub">A Bling delight, delivered.</p>
</div>
<div class="tap">tap anywhere for a burst</div>
<script>
(function () {
  const house = new URLSearchParams(location.search).get("house");
  if (house) document.getElementById("sub").innerHTML =
    "A Bling delight, delivered to <span class=\"house\"></span>.";
  if (house) document.querySelector(".house").textContent = house;

  const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  let W, H;
  function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  size(); addEventListener("resize", size);

  const COLORS = ["#e86aa0", "#ffd166", "#7bdff2", "#b388eb", "#ffffff", "#f4a259"];
  const sparks = [];
  function spark(x, y, burst) {
    const n = burst ? 26 : 3;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = burst ? 2 + Math.random() * 6 : .4 + Math.random() * 1.6;
      sparks.push({
        x: x === undefined ? Math.random() * W : x,
        y: y === undefined ? -10 : y,
        vx: Math.cos(a) * sp * (burst ? 1 : .3),
        vy: burst ? Math.sin(a) * sp - 1 : .6 + Math.random() * 1.8,
        r: 1 + Math.random() * 2.6,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        life: 1, decay: .004 + Math.random() * .01,
        tw: Math.random() * Math.PI * 2
      });
    }
  }
  // gentle ambient shower
  setInterval(() => spark(), 120);
  // opening burst
  for (let i = 0; i < 5; i++) setTimeout(() => spark(W * (.2 + .6 * Math.random()), H * .35, true), i * 260);
  addEventListener("pointerdown", (e) => spark(e.clientX, e.clientY, true));

  function star(x, y, r, c, tw) {
    const s = r * (0.6 + 0.4 * Math.sin(tw));
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = c; ctx.globalAlpha = Math.max(0, s / r);
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const ang = (i * Math.PI) / 4;
      const rr = i % 2 ? s * .35 : s;
      ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy; p.vy += .03; p.tw += .08; p.life -= p.decay;
      if (p.life <= 0 || p.y > H + 20) { sparks.splice(i, 1); continue; }
      star(p.x, p.y, p.r, p.c, p.tw);
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
